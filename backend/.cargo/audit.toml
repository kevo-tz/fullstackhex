[advisories]
ignore = [
    "RUSTSEC-2020-0128",  # false positive — our local cache crate, not the published one
    "RUSTSEC-2021-0006",  # same false positive
    "RUSTSEC-2023-0071",  # rsa Marvin Attack — only reachable through the optional
                          # sqlx-mysql driver (we use Postgres only); the crate is
                          # present in Cargo.lock but is not built for this workspace
    "RUSTSEC-2026-0459",  # libsqlite3-sys CVE — pulled in only by the optional
                          # sqlx-sqlite driver (we use Postgres only); the crate is
                          # present in Cargo.lock but is not built for this workspace
    "RUSTSEC-2026-0543",  # chrono is unmaintained (INFO, no known vulnerability).
                          # oauth2 5.x (the latest release) depends on chrono
                          # unconditionally, so it cannot be removed from the
                          # lockfile, and no patched chrono version exists.
                          # Revisit when oauth2 drops chrono.
]
